<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <title>Reviewly — AP6 Cross-Platform</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><span>Reviewly</span></div>
      <div class="course-switcher"><span class="course-dot"></span><span>AP6 Cross-Platform</span><span class="chevron">⌄</span></div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span>▦</span> Dashboard</button>
        <button class="nav-item" data-view="lessons"><span>▤</span> Lessons</button>
        <button class="nav-item" data-view="flashcards"><span>◇</span> Flashcards</button>
        <button class="nav-item" data-view="quiz"><span>⌁</span> Practice quiz</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="streak-card"><div class="streak-flame">♨</div><div><strong id="streakCount">0 day streak</strong><small>Keep your momentum going</small></div></div>
        <button class="nav-item muted" id="resetProgress"><span>↺</span> Reset progress</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="breadcrumbs">AP6 Cross-Platform <span>/</span> <strong id="pageTitle">Dashboard</strong></div><div class="top-actions"><button class="icon-button" id="themeToggle" title="Toggle dark mode">☾</button><button class="profile-trigger" id="profileTrigger" title="Edit profile"><span class="avatar" id="avatar">A</span></button></div></header>
      <div id="app"></div>
    </main>
  </div>
  <input type="file" id="profileUpload" accept="image/*" hidden />
  <section class="profile-panel" id="profilePanel" hidden><div class="profile-panel-head"><div><p class="eyebrow">Your profile</p><h2>Personalize your reviewer</h2></div><button class="close-profile" id="closeProfile">×</button></div><label for="profileName">Display name</label><input id="profileName" class="profile-input" type="text" maxlength="32" placeholder="Your name" /><div class="profile-upload-row"><div class="avatar avatar-large" id="profilePreview">A</div><div><button class="secondary-btn" id="choosePhoto">Upload profile photo</button><p>Images are saved locally in this browser.</p></div></div><button class="primary-btn" id="saveProfile">Save profile</button></section>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
